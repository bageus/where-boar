name: Export game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and export templates
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          curl -fsSL -o tpl.zip $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q godot.zip && unzip -q tpl.zip
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot 2>/dev/null || sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import and export
        run: |
          mkdir -p build/web build/windows
          godot --headless --import || true
          godot --headless --export-release Web build/web/index.html
          godot --headless --export-release Windows build/windows/WhereBoar.exe
      - uses: actions/upload-artifact@v4
        with:
          name: WhereBoar-windows
          path: build/windows
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
