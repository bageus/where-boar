name: Architecture validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Superseded PR runs are cancelled; pushes to main keep their own sha group and always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate project gates
        run: python tools/validate_project.py
